<h1>🧠 To-Do List</h1>
<div class="task-columns">
  <!-- Colonne À faire -->
  <div
    class="column"
    cdkDropList
    #todoList="cdkDropList"
    [cdkDropListData]="getTasksByStatus('todo')"
    [cdkDropListConnectedTo]="[inProgressList, doneList]"
    (cdkDropListDropped)="onDrop($event, 'todo')"
  >
    <h2>À faire</h2>
    <app-task-form (taskAdded)="addTask($event)"></app-task-form>

    <app-task-list
      [tasks]="getTasksByStatus('todo')"
      (taskClicked)="updateTaskStatus($event)"
      (taskDeleted)="deleteTask($event)"
    ></app-task-list>
  </div>

  <!-- Colonne En cours -->
  <div
    class="column"
    cdkDropList
    #inProgressList="cdkDropList"
    [cdkDropListData]="getTasksByStatus('in-progress')"
    [cdkDropListConnectedTo]="[todoList, doneList]"
    (cdkDropListDropped)="onDrop($event, 'in-progress')"
  >
    <h2>En cours</h2>
    <app-task-list
      [tasks]="getTasksByStatus('in-progress')"
      (taskClicked)="updateTaskStatus($event)"
    ></app-task-list>
  </div>

  <!-- Colonne Terminées -->
  <div
    class="column"
    cdkDropList
    #doneList="cdkDropList"
    [cdkDropListData]="getTasksByStatus('done')"
    [cdkDropListConnectedTo]="[todoList, inProgressList]"
    (cdkDropListDropped)="onDrop($event, 'done')"
  >
    <h2>Terminées</h2>
    <app-task-list
      [tasks]="getTasksByStatus('done')"
      (taskClicked)="updateTaskStatus($event)"
    ></app-task-list>
  </div>
</div>
